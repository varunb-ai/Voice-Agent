# The discipline, made into a gate.
#
# Everything here already existed and was run by hand: the offline suite, the
# pyright config, and the tracked-but-ignored audit documented in .gitignore.
# Running them by hand is why "pyright 0/0" was once reported from a run that
# had not included test_realtime_protocol.py — which held two real errors, one
# of them a latent AttributeError that would have taken the whole suite down.
# A gate cannot forget which paths it checked.
#
# NO API KEY, NO NETWORK, NO PHONE CALL. The suite drives complete scripted
# calls against fake Twilio and OpenAI sockets. If anything here ever needs a
# secret, it has stopped being the offline suite and that is the bug.
name: CI

on:
  push:
  pull_request:

# Back-to-back pushes would otherwise run parallel full suites at ~8 minutes
# each. Only the newest commit on a ref is worth the runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the development interpreter. The suite uses 3.12 syntax and
          # the f-strings in it lean on PEP 701 nested quotes, so an older
          # runner fails at parse time rather than on an assertion.
          python-version: "3.12"
          cache: pip

      # THE GOLDEN PATH ONLY, FROM THE FILE. requirements.txt still carries the
      # legacy scaffolding (crawl4ai, playwright, langgraph, celery, psycopg);
      # none of it is on the realtime path and none of it is imported by the
      # suite. This list lived inline here for exactly one commit, which is one
      # copy too many: a second copy of the golden-path list is the same drift
      # this whole exercise has been hunting. It is in one place now, and every
      # push re-proves that place is sufficient by running the suite against it.
      - name: Install the realtime path's dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-realtime.txt

      # ── The offline suite ────────────────────────────────────────────────
      # Exit code 0 means every assertion passed. It prints its own PASS/FAIL
      # lines, so the log is the report.
      #
      # PYTHONUTF8: the suite prints emoji in check names, and a runner with a
      # non-UTF-8 default encoding dies on the first one.
      - name: Offline protocol suite
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: python test_realtime_protocol.py

      # ── Types ────────────────────────────────────────────────────────────
      # PINNED. Unpinned, pyright floats on latest and a new release can turn
      # this red with zero repo changes — a gate should no more drift than it
      # should forget. 1.1.413 is the version the two errors this step exists
      # for were found and fixed under.
      #
      # NO PATH ARGUMENTS. `include` in pyrightconfig.json is the one list, and
      # a copy of it here is the same drift as the dependency list above — the
      # two HAD already diverged: check_refusals.py was in the CLI arguments
      # and missing from the config. The scoping mistake this step exists to
      # prevent was running pyright over three of four paths and reporting the
      # result as though it covered the repo.
      - name: Pyright
        run: npx --yes pyright@1.1.413

      # ── Repository hygiene ───────────────────────────────────────────────
      # A tracked file that .gitignore also matches is living on borrowed time:
      # git leaves already-tracked files alone, so it keeps working until
      # somebody removes and re-adds it, then vanishes. This loop found
      # data/calls.json (57 legacy call records, 56 with transcripts) still
      # tracked under the data/ policy, and then found thirteen more — every
      # file the negation block claimed to re-admit, because git will not
      # descend into an excluded directory and the negations had never run.
      #
      # --no-index is load-bearing: without it git suppresses the match for
      # exactly the files this is looking for, and the loop reports nothing.
      #
      # `-z` AND A NUL-DELIMITED READ, not `for f in $(git ls-files)`. Word
      # splitting turns "data/3 cases jsons/x.json" into four paths that do not
      # exist, and `git check-ignore -q` on a path that does not exist exits
      # non-zero — so the loop finds nothing and the gate PASSES. A false
      # negative, in the check whose entire job is catching false negatives. No
      # tracked path has a space today; this repo writes them constantly
      # ("3 cases jsons", "3 cases voice"), so it was one `git add` away.
      - name: No tracked file is also ignored
        run: |
          trapped=$(git ls-files -z | while IFS= read -r -d '' f; do
            git check-ignore -q --no-index "$f" && printf '  %s\n' "$f"
          done)
          if [ -n "$trapped" ]; then
            echo "Tracked AND ignored — these vanish the first time they are re-added:"
            echo "$trapped"
            exit 1
          fi
          echo "clean: index and ignore rules agree"

      # Secrets have never been committed and the point is to keep it that way.
      #
      # THIS ASSERTS .gitignore RATHER THAN RESTATING IT, and the difference is
      # the whole design. The first version carried its own regex of
      # secret-shaped paths — a second copy of the patterns at the top of
      # .gitignore, agreeing today with nothing making them agree tomorrow,
      # which is the drift this repo keeps finding.
      #
      # It does not need to scan the index at all. The step above proves no
      # TRACKED file is ignored; this one proves a secret-shaped file WOULD be
      # ignored. Together: if a secret were ever added, .gitignore matches it
      # (proved here) and the step above then fails on it. Two properties that
      # compose, rather than one property written twice.
      #
      # The shapes below are the canonical list and live in exactly one place.
      - name: .gitignore still covers the secret shapes
        run: |
          fail=0
          for shape in .env .env.production private.key server.pem cert.p12 \
                       credentials.json agents/secret.key; do
            if git check-ignore -q --no-index "$shape"; then
              echo "  ignored: $shape"
            else
              echo "  NOT IGNORED: $shape"; fail=1
            fi
          done
          # And the one that must stay visible, or a new clone has no template.
          if git check-ignore -q --no-index .env.example; then
            echo "  .env.example is ignored — the setup template would vanish"; fail=1
          else
            echo "  tracked as intended: .env.example"
          fi
          exit $fail
